<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVault — Live TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP NAV -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">Stream<em>Vault</em></span>
    </div>
  </div>
  <div class="topbar-center">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search channels, countries...">
      <kbd class="search-shortcut">⌘K</kbd>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-icon" id="favToggle" title="Favourites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <button class="btn-icon" id="themeToggle" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">BROWSE</p>
      <nav class="category-nav" id="categoryNav">
        <button class="cat-btn active" data-cat="All">
          <span class="cat-icon">◈</span> All Channels
          <span class="cat-count" id="totalCount">0</span>
        </button>
        <button class="cat-btn" data-cat="__favorites__">
          <span class="cat-icon">★</span> Favourites
          <span class="cat-count" id="favCount">0</span>
        </button>
      </nav>
    </div>
    <div class="sidebar-section" id="countrySection">
      <p class="sidebar-label">BY COUNTRY</p>
      <nav class="category-nav" id="countryNav">
        <!-- populated by JS -->
      </nav>
    </div>
  </aside>

  <!-- CONTENT AREA -->
  <main class="content">

    <!-- PLAYER SECTION -->
    <section class="player-section" id="playerSection">
      <div class="player-wrapper">
        <div class="player-container" id="playerContainer">
          <div class="player-placeholder" id="playerPlaceholder">
            <div class="placeholder-inner">
              <div class="placeholder-icon">▶</div>
              <p class="placeholder-title">Select a channel to watch</p>
              <p class="placeholder-sub">Choose from <span id="hintCount">0</span> live streams</p>
            </div>
          </div>
          <video id="videoPlayer" controls playsinline></video>
          <div class="player-overlay" id="playerOverlay">
            <div class="now-playing-badge">
              <span class="live-dot"></span> LIVE
            </div>
            <div class="channel-info-bar">
              <img class="cib-logo" id="nowLogo" src="" alt="">
              <div>
                <p class="cib-name" id="nowName">—</p>
                <p class="cib-group" id="nowGroup">—</p>
              </div>
              <div class="cib-actions">
                <button class="cib-btn" id="favBtn" title="Favourite">☆</button>
                <button class="cib-btn" id="pipBtn" title="Picture in Picture">⧉</button>
                <button class="cib-btn" id="fsBtn" title="Fullscreen">⛶</button>
              </div>
            </div>
          </div>
          <div class="player-error" id="playerError">
            <p>⚠ Stream unavailable</p>
            <button onclick="retryStream()">↺ Retry</button>
          </div>
          <div class="player-loading" id="playerLoading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- CHANNEL GRID -->
    <section class="channels-section">
      <div class="channels-header">
        <h2 class="channels-title" id="channelsTitle">All Channels</h2>
        <div class="view-controls">
          <button class="view-btn active" id="gridView" title="Grid view">⊞</button>
          <button class="view-btn" id="listView" title="List view">≡</button>
        </div>
      </div>
      <div class="channels-grid" id="channelsGrid">
        <!-- populated by JS -->
      </div>
    </section>

  </main>
</div>

<!-- MOBILE SIDEBAR TOGGLE -->
<button class="mobile-menu-btn" id="mobileMenu">☰</button>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="script.js"></script>
</body>
</html>
